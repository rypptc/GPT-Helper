<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f8f9fa;
      color: #2d3748;
    }

    header {
      padding: 14px 16px 10px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #e2e8f0;
      color: #6b46c1;
    }

    .form {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input, textarea {
      background: #ffffff;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      color: #2d3748;
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      font-family: inherit;
      resize: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus {
      border-color: #6b46c1;
    }

    input::placeholder, textarea::placeholder {
      color: #a0aec0;
    }

    textarea { height: 72px; line-height: 1.5; }

    button.add {
      background: #6b46c1;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button.add:hover { background: #553c9a; }

    .list {
      max-height: 300px;
      overflow-y: auto;
    }

    .prompt-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
      gap: 10px;
    }

    .prompt-item:last-child { border-bottom: none; }

    .prompt-info { flex: 1; min-width: 0; }

    .prompt-name {
      font-weight: 600;
      font-size: 12px;
      color: #6b46c1;
      margin-bottom: 2px;
    }

    .prompt-text {
      font-size: 11px;
      color: #718096;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button.delete {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: 15px;
      padding: 0;
      flex-shrink: 0;
      line-height: 1;
    }

    button.delete:hover { color: #e53e3e; }

    .empty {
      padding: 20px 16px;
      color: #a0aec0;
      text-align: center;
      font-size: 12px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .toggle-label {
      font-size: 12px;
      color: #2d3748;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input { display: none; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #cbd5e0;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: #e53e3e;
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <header>GPT Helper</header>

  <div class="toggle-row">
    <span class="toggle-label">Modo borrado</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-delete" />
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="form">
    <input id="input-name" type="text" placeholder="Nombre  (ej: Resumen)" maxlength="40" />
    <textarea id="input-text" placeholder="Texto del prompt..."></textarea>
    <button class="add" id="btn-add">Guardar prompt</button>
  </div>

  <div class="list" id="prompt-list"></div>

  <script src="popup.js"></script>
</body>
</html>
